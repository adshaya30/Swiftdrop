server {
    listen 8080;
    listen [::]:8080;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Docker DNS resolver for dynamic upstreams
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Reverse proxy for API calls (when frontend is accessed directly via port 5173)
    location /api/ {
        set $gateway_upstream http://api-gateway:8080;
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed static assets -> immutable long cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html -> no cache
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }
        # Forward API requests to the API Gateway
    location /api/ {
        proxy_pass http://api-gateway:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA history API fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location = /healthz {
        access_log off;
        return 200 "OK\n";
    }
}
