spring:
  application:
    name: notification
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/swiftdrop_notification}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:}
    password: ${RABBITMQ_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  jackson:
    deserialization:
      FAIL_ON_UNKNOWN_PROPERTIES: true
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  lifecycle:
    timeout-per-shutdown-phase: 30s
  mail:
    host: ${SMTP_HOST:mailpit}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 10000
server:
  port: ${SERVER_PORT:8086}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: db
        liveness:
          include: ping
  metrics:
    export:
      prometheus:
        enabled: true
logging:
  level:
    root: ${LOG_LEVEL:INFO}
springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
swiftdrop:
  security:
    jwt-public-key-path: ${JWT_PUBLIC_KEY_PATH:}
    internal-api-key: ${INTERNAL_API_KEY:}
notification:
  smtp:
    from: ${SMTP_FROM:noreply@swiftdrop.example}
  sms:
    provider: ${SMS_PROVIDER:mock}
  webhook:
    secret-key: ${WEBHOOK_SECRET_ENCRYPTION_KEY:}
    allow-private-targets: ${WEBHOOK_ALLOW_PRIVATE_TARGETS:true}
    allow-http: ${WEBHOOK_ALLOW_HTTP:true}
    timeout-seconds: ${WEBHOOK_TIMEOUT_SECONDS:10}
    max-attempts: ${WEBHOOK_MAX_ATTEMPTS:6}
    retry-delays: ${WEBHOOK_RETRY_DELAYS:PT1M,PT5M,PT30M,PT2H,PT6H}
  auth-service-url: ${AUTH_SERVICE_URL:http://localhost:8081}
  parcel-service-url: ${PARCEL_SERVICE_URL:http://localhost:8082}
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
