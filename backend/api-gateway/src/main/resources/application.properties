
spring.application.name=gateway
server.port=8080

management.server.port=${MANAGEMENT_SERVER_PORT:8090}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.endpoints.web.base-path=/actuator
management.health.gateway.enabled=false

spring.main.banner-mode=off
logging.level.root=${LOG_LEVEL:INFO}
logging.structured.format.console=logstash
logging.structured.json.add.service=${spring.application.name:unknown}

spring.cloud.gateway.server.webflux.httpclient.connect-timeout=3000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=10s

# Handle CORS preflight requests even when no gateway route matches OPTIONS
spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true

AUTH_SERVICE_URL=http://auth-service:8081
PARCEL_SERVICE_URL=http://parcel-service:8082
PRICING_SERVICE_URL=http://pricing-service:8083
DELIVERY_SERVICE_URL=http://delivery-service:8084
TRACKING_SERVICE_URL=http://tracking-service:8085
NOTIFICATION_SERVICE_URL=http://notification-service:8086
FRONTEND_URL=http://frontend:8080
AI_ASSISTANT_URL=http://ai-assistant:8000
PUBLIC_BASE_URL=http://localhost:8080
RATE_LIMIT_ENABLED=true
HSTS_ENABLED=false
