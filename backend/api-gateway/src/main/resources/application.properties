spring.application.name=gateway
server.port=${SERVER_PORT:8080}
management.server.port=${MANAGEMENT_SERVER_PORT:8090}
management.endpoint.health.probes.enabled=true

# SRS 3.7 Route 3: auth-service (port 8081)
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=${AUTH_SERVICE_URL:http://${AUTH_SERVICE_HOST:localhost}:${AUTH_SERVICE_PORT:8081}}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/auth/**, /api/v1/oauth/**, /api/v1/me, /api/v1/me/**, /api/v1/merchant/credentials/**, /api/v1/admin/users/**, /api/v1/admin/merchants/**, /api/v1/admin/dashboard/merchants/**

# Deduplicate CORS headers to avoid duplicate header conflicts when downstream services also return CORS headers
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
spring.cloud.gateway.server.webflux.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
