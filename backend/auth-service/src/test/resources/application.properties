spring.application.name=auth-service-test
server.port=0

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Jackson: fail on unknown properties globally (JSON deserialization guard)
spring.jackson.deserialization.fail-on-unknown-properties=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Test configuration - strictly isolated non-production fixtures
jwt.private-key-path=classpath:certs/test_private_key.pem
refresh.grace-seconds=10
refresh.family-max-days=30
auth.cookie.secure=false

# Housekeeping & Purge Jobs (FR-AUTH-026)
auth.cleanup.refresh-tokens.enabled=true
auth.cleanup.refresh-tokens.retention-days=7
auth.cleanup.refresh-tokens.batch-size=1000

# Bootstrap Admin (FR-AUTH-015) - disabled by default for generic tests; enabled in dedicated bootstrap tests
auth.bootstrap.enabled=false
delivery.service.url=http://localhost:8084
internal.api.key=test-internal-api-key

# Google OAuth 2.0 (FR-AUTH-009, FR-AUTH-010, FR-AUTH-011)
auth.google.client-id=test-google-client-id
auth.google.client-secret=test-google-client-secret
auth.google.redirect-uri=http://localhost:8080/api/v1/auth/google/callback
auth.frontend-url=http://localhost:5173

# Logging
logging.level.root=INFO
logging.level.com.swiftdrop=DEBUG
