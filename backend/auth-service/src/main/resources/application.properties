spring.application.name=auth-service
server.port=${SERVER_PORT:8081}

# DataSource
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/swiftdrop}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:swiftdrop}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Swiftdrop#2003}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Jackson: fail on unknown properties globally (JSON deserialization guard)
spring.jackson.deserialization.fail-on-unknown-properties=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# JWT RS256 & Session Cookie Configuration (SRS v2.1 Section 3.6, FR-AUTH-003, FR-AUTH-006, FR-AUTH-007, FR-AUTH-008)
# Private key is loaded from secret mount or environment path
jwt.private-key-path=${JWT_PRIVATE_KEY_PATH:classpath:certs/dev_private_key.pem}
refresh.grace-seconds=${REFRESH_GRACE_SECONDS:10}
refresh.family-max-days=${REFRESH_FAMILY_MAX_DAYS:30}
auth.cookie.secure=${COOKIE_SECURE:false}

# Housekeeping & Purge Jobs (SRS v2.1 Section 6.5, FR-AUTH-026)
auth.cleanup.refresh-tokens.enabled=${AUTH_CLEANUP_REFRESH_TOKENS_ENABLED:true}
auth.cleanup.refresh-tokens.cron=${AUTH_CLEANUP_REFRESH_TOKENS_CRON:0 0 3 * * *}
auth.cleanup.refresh-tokens.retention-days=${AUTH_CLEANUP_REFRESH_TOKENS_RETENTION_DAYS:7}
auth.cleanup.refresh-tokens.batch-size=${AUTH_CLEANUP_REFRESH_TOKENS_BATCH_SIZE:1000}

# Bootstrap Admin (FR-AUTH-015)
auth.bootstrap.enabled=${AUTH_BOOTSTRAP_ENABLED:true}
auth.bootstrap.admin-email=${BOOTSTRAP_ADMIN_EMAIL:}
auth.bootstrap.admin-name=${BOOTSTRAP_ADMIN_NAME:}
auth.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}

# Internal delivery-service communication (FR-AUTH-020, Flow 4.6)
delivery.service.url=${DELIVERY_SERVICE_URL:http://localhost:8084}
internal.api.key=${INTERNAL_API_KEY:swiftdrop-internal-secret-key}

# Google OAuth 2.0 (FR-AUTH-009, FR-AUTH-010, FR-AUTH-011)
auth.google.client-id=${GOOGLE_CLIENT_ID:}
auth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
auth.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/auth/google/callback}
auth.frontend-url=${FRONTEND_URL:http://localhost:5173}
auth.cleanup.oauth-states.cron=${AUTH_CLEANUP_OAUTH_STATES_CRON:0 0 * * * *}

# Logging – never print credentials
logging.level.root=INFO
logging.level.com.swiftdrop=DEBUG
