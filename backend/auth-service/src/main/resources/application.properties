spring.application.name=auth-service
server.port=${SERVER_PORT:8080}

# DataSource
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/swiftdrop_auth}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Jackson: fail on unknown properties globally (JSON deserialization guard)
spring.jackson.deserialization.fail-on-unknown-properties=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# JWT RS256 & Session Cookie Configuration (SRS v2.1 Section 3.6, FR-AUTH-003, FR-AUTH-006, FR-AUTH-007)
jwt.private-key-path=${JWT_PRIVATE_KEY_PATH:classpath:certs/private_key.pem}
auth.cookie.secure=${COOKIE_SECURE:false}

# Logging – never print credentials
logging.level.root=INFO
logging.level.com.swiftdrop=DEBUG
