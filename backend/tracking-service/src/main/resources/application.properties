spring.application.name=tracking
server.port=${SERVER_PORT:8085}
management.endpoint.health.probes.enabled=true
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/swiftdrop_tracking}}
spring.datasource.username=${DB_USER:${SPRING_DATASOURCE_USERNAME:tracking_user}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.rabbitmq.host=${RABBITMQ_HOST:${SPRING_RABBITMQ_HOST:localhost}}
spring.rabbitmq.port=${RABBITMQ_PORT:${SPRING_RABBITMQ_PORT:5672}}
spring.rabbitmq.username=${RABBITMQ_USER:${SPRING_RABBITMQ_USERNAME:}}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:${SPRING_RABBITMQ_PASSWORD:}}
