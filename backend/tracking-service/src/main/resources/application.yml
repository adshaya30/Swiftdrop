spring:
  application:
    name: tracking
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/swiftdrop_tracking}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:}
    password: ${RABBITMQ_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  jackson:
    deserialization:
      FAIL_ON_UNKNOWN_PROPERTIES: true
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  lifecycle:
    timeout-per-shutdown-phase: 30s
server:
  port: ${SERVER_PORT:8085}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: db
        liveness:
          include: ping
  metrics:
    export:
      prometheus:
        enabled: true
logging:
  level:
    root: ${LOG_LEVEL:INFO}
springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
swiftdrop:
  security:
    jwt-public-key-path: ${JWT_PUBLIC_KEY_PATH:}
    internal-api-key: ${INTERNAL_API_KEY:}
